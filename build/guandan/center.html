<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>游戏中心 · 阳鸽</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: #24312c;
    background:
      radial-gradient(ellipse at 50% 38%, rgba(255,255,255,.72), transparent 55%),
      linear-gradient(145deg, #f7f4ea 0%, #f1ede2 48%, #e9e4d6 100%);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .wrap { width: min(980px, calc(100vw - 56px)); }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .mark {
    width: 48px; height: 48px; border-radius: 15px;
    display: grid; place-items: center;
    background: #e0ede6; color: #2f6b53;
    border: 1px solid #c6dbce;
  }
  h1 { margin: 0; font-size: 26px; letter-spacing: .04em; font-weight: 700; }
  header p { margin: 4px 0 0; color: #6b756f; font-size: 13px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .game {
    position: relative; display: block; text-decoration: none; color: inherit;
    background: #fffdf8; border: 1px solid #e5dfd2; border-radius: 22px;
    padding: 26px 26px 22px; min-height: 230px;
    box-shadow: 0 18px 40px rgba(50,60,54,.08);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    overflow: hidden;
  }
  .game:hover { transform: translateY(-4px); border-color: #b9d0c2; box-shadow: 0 24px 52px rgba(50,60,54,.14); }
  .game .glyph { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; background: #f1ede2; border: 1px solid #e1dac9; }
  .game h2 { margin: 18px 0 6px; font-size: 21px; letter-spacing: .03em; }
  .game p { margin: 0; color: #6b756f; font-size: 13px; line-height: 1.7; }
  .tag { position: absolute; top: 22px; right: 22px; font-size: 11px; padding: 4px 9px; border-radius: 999px; background: #eaf1ec; color: #2f6b53; border: 1px solid #cfe0d5; }
  .tag.warm { background: #f7ebe8; color: #a14b3a; border-color: #e3c3ba; }
  .go { position: absolute; left: 26px; bottom: 20px; font-size: 13px; color: #2f6b53; font-weight: 600; }
  .go::after { content: " →"; }
  footer { margin-top: 24px; text-align: center; color: #8a938d; font-size: 12px; letter-spacing: .08em; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="mark" aria-hidden="true">
        <svg width="27" height="27" viewBox="0 0 24 24" fill="none">
          <path d="M7.4 8.2h9.2a4.4 4.4 0 0 1 4.3 5.4l-.7 3.1a2.2 2.2 0 0 1-3.9 1l-1.2-1.7H8.9l-1.2 1.7a2.2 2.2 0 0 1-3.9-1l-.7-3.1a4.4 4.4 0 0 1 4.3-5.4Z" stroke="currentColor" stroke-width="1.7"/>
          <path d="M7 11.2v3M5.5 12.7h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="16.1" cy="11.7" r=".95" fill="currentColor"/>
          <circle cx="18.2" cy="13.8" r=".95" fill="currentColor"/>
        </svg>
      </div>
      <div>
        <h1>游戏中心</h1>
        <p>局域网小游戏 · 不连外网 · 打开即玩</p>
      </div>
    </header>

    <section class="grid">
      <a class="game" data-keep-query href="./index.html">
        <span class="tag">内网联机</span>
        <div class="glyph" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
            <rect x="3.8" y="5.2" width="9.6" height="13.6" rx="2.2" transform="rotate(-11 8.6 12)" stroke="#2f6b53" stroke-width="1.6"/>
            <rect x="10.2" y="6.4" width="9.6" height="13.6" rx="2.2" transform="rotate(9 15 13.2)" stroke="#2f6b53" stroke-width="1.6"/>
          </svg>
        </div>
        <h2>掼蛋</h2>
        <p>四人两两组队，支持内网开房间；<br/>内置「合肥规则」与掼蛋王排行榜。</p>
        <span class="go">进入游戏</span>
      </a>

      <a class="game" data-keep-query href="./mahjong/classic.html">
        <span class="tag warm">单机对 AI</span>
        <div class="glyph" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
            <rect x="3.2" y="5.5" width="7.4" height="10.5" rx="1.6" stroke="#a14b3a" stroke-width="1.5"/>
            <rect x="13.4" y="8" width="7.4" height="10.5" rx="1.6" stroke="#a14b3a" stroke-width="1.5"/>
            <circle cx="6.9" cy="10.7" r="1.1" fill="#a14b3a"/>
            <circle cx="17.1" cy="13.2" r="1.1" fill="#a14b3a"/>
          </svg>
        </div>
        <h2>麻将</h2>
        <p>四人中国麻将，三人 AI 对战；<br/>吃碰杠胡、番数结算与四圈牌局。</p>
        <span class="go">进入游戏</span>
      </a>
    </section>

    <footer>阳鸽 · GAME CENTER</footer>
  </main>
  <script src="./nav.js"></script>
</body>
</html>
